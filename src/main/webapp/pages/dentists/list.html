<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentists - Dental Clinic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --primary: #3CA6A6;
            --primary-dark: #2D8C8C;
            --secondary: #4299e1;
            --success: #48bb78;
            --warning: #ecc94b;
            --danger: #f56565;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --gray: #7f8c8d;
            --border: #eaeaea;
            --card-bg: #ffffff;
            --sidebar-bg: #1a2530;
        }

        body {
            background: #F3F4F6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: var(--sidebar-bg);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left h1 i {
            color: var(--primary);
        }

        .header-left p {
            opacity: 0.9;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            text-decoration: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #38a169);
            color: white;
            box-shadow: 0 4px 8px rgba(72, 187, 120, 0.3);
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #38a169, var(--success));
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(72, 187, 120, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 8px rgba(60, 166, 166, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(60, 166, 166, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #c53030);
            color: white;
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #c53030, var(--danger));
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 6px;
        }

        .btn-toggle-active {
            background: rgba(72, 187, 120, 0.15);
            color: var(--success);
            border: 1px solid rgba(72, 187, 120, 0.3);
        }

        .btn-toggle-active:hover {
            background: rgba(72, 187, 120, 0.25);
            transform: translateY(-2px);
        }

        .btn-toggle-inactive {
            background: rgba(245, 101, 101, 0.15);
            color: var(--danger);
            border: 1px solid rgba(245, 101, 101, 0.3);
        }

        .btn-toggle-inactive:hover {
            background: rgba(245, 101, 101, 0.25);
            transform: translateY(-2px);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 30px 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-header h2 {
            font-size: 24px;
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header h2 i {
            color: var(--primary);
        }

        .search-section {
            padding: 0 30px 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .search-box input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(60, 166, 166, 0.1);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 13px;
            color: var(--gray);
            font-weight: 500;
        }

        .filter-btn {
            padding: 6px 14px;
            border: 2px solid var(--border);
            border-radius: 20px;
            background: white;
            color: var(--dark);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            background: rgba(60, 166, 166, 0.05);
        }

        .filter-btn.active {
            border-color: var(--primary);
            background: rgba(60, 166, 166, 0.1);
            color: var(--primary);
        }

        .filter-btn.active-filter-all {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .filter-btn.active-filter-all:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        .filter-btn .dot-active {
            color: var(--success);
            font-size: 8px;
        }

        .filter-btn .dot-inactive {
            color: var(--danger);
            font-size: 8px;
        }

        .filter-count {
            background: rgba(0,0,0,0.08);
            padding: 0 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .filter-btn.active-filter-all .filter-count {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .table-container {
            padding: 0 30px 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--light);
            color: var(--dark);
            font-weight: 600;
            text-align: left;
            padding: 15px;
            border-bottom: 2px solid var(--border);
            font-size: 14px;
            white-space: nowrap;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            color: var(--dark);
            vertical-align: middle;
        }

        tr:hover {
            background: var(--light);
        }

        tr.inactive-row {
            opacity: 0.7;
        }

        tr.inactive-row .dentist-name {
            color: var(--gray);
        }

        .dentist-name {
            font-weight: 600;
            color: var(--dark);
        }

        .contact-info {
            font-size: 13px;
            color: var(--gray);
            margin-top: 3px;
        }

        .contact-info i {
            width: 16px;
            color: var(--primary);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-badge.active {
            background: rgba(72, 187, 120, 0.15);
            color: var(--success);
        }

        .status-badge.inactive {
            background: rgba(245, 101, 101, 0.15);
            color: var(--danger);
        }

        .status-badge i {
            font-size: 8px;
        }

        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-btn {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            filter: brightness(0.9);
        }

        .action-edit {
            background: rgba(236, 201, 75, 0.15);
            color: var(--warning);
        }

        .action-edit:hover {
            background: rgba(236, 201, 75, 0.25);
        }

        .action-delete {
            background: rgba(245, 101, 101, 0.15);
            color: var(--danger);
        }

        .action-delete:hover {
            background: rgba(245, 101, 101, 0.25);
        }

        .loading {
            padding: 60px;
            text-align: center;
            color: var(--gray);
        }

        .loading i {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
            color: var(--primary);
        }

        .empty-state h3 {
            color: var(--dark);
            margin-bottom: 10px;
            font-size: 20px;
        }

        .empty-state p {
            margin-bottom: 20px;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            animation: slideIn 0.3s ease;
            border-left: 4px solid var(--success);
            max-width: 400px;
        }

        .toast.error { border-left-color: var(--danger); }
        .toast.success { border-left-color: var(--success); }
        .toast.warning { border-left-color: var(--warning); }
        .toast.info { border-left-color: var(--secondary); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .header-actions {
                width: 100%;
                justify-content: center;
            }

            .search-section {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                justify-content: center;
            }

            table {
                display: block;
                overflow-x: auto;
            }

            .actions {
                justify-content: center;
            }

            .actions .btn-sm {
                font-size: 11px;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <h1><i class="fas fa-user-md"></i> Dentist Management</h1>
            <p><i class="fas fa-tooth"></i> Manage all dental specialists</p>
        </div>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="window.location.href='/dental_clinic_webapp_war_exploded/dashboard'">
                <i class="fas fa-arrow-left"></i> Dashboard
            </button>
            <button class="btn btn-success" onclick="window.location.href='/dental_clinic_webapp_war_exploded/pages/dentists/add.html'">
                <i class="fas fa-plus"></i> Add Dentist
            </button>
        </div>
    </div>

    <!-- Section Header -->
    <div class="section-header">
        <h2><i class="fas fa-list"></i> All Dentists</h2>
        <span id="dentistCount" style="color: var(--gray); font-size: 14px;">Loading...</span>
    </div>

    <!-- Search and Filters -->
    <div class="search-section">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search by name, specialization, or license..." oninput="filterDentists()">
        </div>
        <div class="filter-group">
            <span class="filter-label"><i class="fas fa-filter"></i> Status:</span>
            <button class="filter-btn active-filter-all" data-filter="all" onclick="setStatusFilter('all')">
                <i class="fas fa-users"></i> All <span class="filter-count" id="countAll">0</span>
            </button>
            <button class="filter-btn" data-filter="active" onclick="setStatusFilter('active')">
                <i class="fas fa-circle dot-active"></i> Active <span class="filter-count" id="countActive">0</span>
            </button>
            <button class="filter-btn" data-filter="inactive" onclick="setStatusFilter('inactive')">
                <i class="fas fa-circle dot-inactive"></i> Inactive <span class="filter-count" id="countInactive">0</span>
            </button>
        </div>
    </div>

    <!-- Dentist Table -->
    <div class="table-container">
        <div class="loading" id="loadingMessage">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading dentists from database...</p>
        </div>

        <table id="dentistTable" style="display: none;">
            <thead>
            <tr>
                <th style="min-width: 200px;">Dentist</th>
                <th>Specialization</th>
                <th>Contact</th>
                <th>License</th>
                <th style="text-align: center;">Fee</th>
                <th style="text-align: center;">Status</th>
                <th style="text-align: center;">Actions</th>
            </tr>
            </thead>
            <tbody id="dentistTableBody">
            <!-- Dentists will be loaded here -->
            </tbody>
        </table>

        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fas fa-user-md-slash"></i>
            <h3>No Dentists Found</h3>
            <p id="emptyMessage">Add your first dentist to the system.</p>
            <button class="btn btn-primary" onclick="window.location.href='/dental_clinic_webapp_war_exploded/pages/dentists/add.html'">
                <i class="fas fa-plus"></i> Add Dentist
            </button>
        </div>
    </div>
</div>

<div id="toastContainer"></div>

<script>
    var CONTEXT_PATH = '/dental_clinic_webapp_war_exploded';
    var allDentists = [];
    var currentStatusFilter = 'all';

    document.addEventListener('DOMContentLoaded', function() {
        loadDentists();
    });

    function loadDentists() {
        var loading = document.getElementById('loadingMessage');
        loading.style.display = 'block';
        document.getElementById('dentistTable').style.display = 'none';
        document.getElementById('emptyState').style.display = 'none';

        fetch(CONTEXT_PATH + '/api/dentists?action=list&t=' + Date.now())
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(function(data) {
                // Ensure each dentist has a proper active status
                allDentists = data.map(function(dentist) {
                    // The field from backend is 'active' (since we changed the model)
                    dentist.active = dentist.active === true;
                    return dentist;
                });

                console.log('Loaded dentists with status:');
                allDentists.forEach(function(d) {
                    console.log('  - ID: ' + d.dentistId + ', Name: ' + d.firstName + ' ' + d.lastName + ', Active: ' + d.active);
                });

                updateCounts();
                filterDentists();
                loading.style.display = 'none';
            })
            .catch(function(error) {
                console.error('Error loading dentists:', error);
                loading.innerHTML = '<i class="fas fa-exclamation-circle" style="color: var(--danger);"></i>' +
                    '<p style="color: var(--danger);">Failed to load dentists from database</p>' +
                    '<p style="font-size: 12px; color: var(--gray);">' + error.message + '</p>' +
                    '<button class="btn btn-primary" onclick="loadDentists()" style="margin-top: 15px;">' +
                    '<i class="fas fa-sync-alt"></i> Retry</button>';
            });
    }

    function updateCounts() {
        var active = allDentists.filter(function(d) { return d.active === true; }).length;
        var inactive = allDentists.filter(function(d) { return d.active === false; }).length;
        document.getElementById('countAll').textContent = allDentists.length;
        document.getElementById('countActive').textContent = active;
        document.getElementById('countInactive').textContent = inactive;
    }

    function setStatusFilter(filter) {
        currentStatusFilter = filter;

        // Update filter button styles
        document.querySelectorAll('.filter-btn').forEach(function(btn) {
            btn.classList.remove('active-filter-all');
            btn.classList.remove('active');
        });

        var activeBtn = document.querySelector('.filter-btn[data-filter="' + filter + '"]');
        if (filter === 'all') {
            activeBtn.classList.add('active-filter-all');
        } else {
            activeBtn.classList.add('active');
        }

        filterDentists();
    }

    function filterDentists() {
        var searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

        var filtered = allDentists.filter(function(dentist) {
            // Search filter
            var name = (dentist.firstName + ' ' + dentist.lastName).toLowerCase();
            var specialization = (dentist.specialization || '').toLowerCase();
            var license = (dentist.licenseNumber || '').toLowerCase();
            var matchesSearch = name.includes(searchTerm) ||
                specialization.includes(searchTerm) ||
                license.includes(searchTerm);

            if (!matchesSearch) return false;

            // Status filter
            if (currentStatusFilter === 'active') {
                return dentist.active === true;
            } else if (currentStatusFilter === 'inactive') {
                return dentist.active === false;
            }

            return true;
        });

        displayDentists(filtered);
        updateCountDisplay(filtered.length);
    }

    function updateCountDisplay(count) {
        var label = count + ' dentist' + (count !== 1 ? 's' : '');
        if (currentStatusFilter !== 'all') {
            label += ' (' + currentStatusFilter + ')';
        }
        document.getElementById('dentistCount').textContent = label;
    }

    function displayDentists(dentistsToShow) {
        var tbody = document.getElementById('dentistTableBody');
        var loading = document.getElementById('loadingMessage');
        var table = document.getElementById('dentistTable');
        var emptyState = document.getElementById('emptyState');
        var emptyMessage = document.getElementById('emptyMessage');

        loading.style.display = 'none';

        if (!dentistsToShow || dentistsToShow.length === 0) {
            table.style.display = 'none';
            emptyState.style.display = 'block';

            var searchTerm = document.getElementById('searchInput').value.trim();
            if (searchTerm) {
                emptyMessage.textContent = 'No dentists match your search criteria.';
            } else if (currentStatusFilter === 'active') {
                emptyMessage.textContent = 'No active dentists found.';
            } else if (currentStatusFilter === 'inactive') {
                emptyMessage.textContent = 'No inactive dentists found.';
            } else {
                emptyMessage.textContent = 'Add your first dentist to the system.';
            }
            return;
        }

        table.style.display = 'table';
        emptyState.style.display = 'none';
        tbody.innerHTML = '';

        dentistsToShow.forEach(function(dentist) {
            var row = document.createElement('tr');
            var isActive = dentist.active === true;

            if (!isActive) {
                row.classList.add('inactive-row');
            }

            var initials = (dentist.firstName[0] + dentist.lastName[0]).toUpperCase();

            // Status badge
            var statusBadge = isActive
                ? '<span class="status-badge active"><i class="fas fa-circle"></i> Active</span>'
                : '<span class="status-badge inactive"><i class="fas fa-circle"></i> Inactive</span>';

            // Toggle button
            var toggleLabel = isActive ? 'Deactivate' : 'Activate';
            var toggleClass = isActive ? 'btn-toggle-active' : 'btn-toggle-inactive';
            var toggleIcon = isActive ? 'fa-pause' : 'fa-play';

            row.innerHTML = `
                <td>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
                             display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 16px; flex-shrink: 0;">
                            ${initials}
                        </div>
                        <div>
                            <div class="dentist-name">${dentist.firstName} ${dentist.lastName}</div>
                        </div>
                    </div>
                </td>
                <td>
                    <div style="color: var(--dark);">${dentist.specialization || 'N/A'}</div>
                </td>
                <td>
                    <div><i class="fas fa-phone" style="color: var(--primary); width: 16px;"></i> ${dentist.contactNumber || 'N/A'}</div>
                    <div class="contact-info"><i class="fas fa-envelope"></i> ${dentist.email || 'N/A'}</div>
                </td>
                <td>
                    <div style="font-size: 13px; color: var(--gray);">${dentist.licenseNumber || 'N/A'}</div>
                </td>
                <td style="text-align: center;">
                    <div style="font-weight: 600; color: var(--success);">$${dentist.consultationFee ? dentist.consultationFee.toFixed(2) : '0.00'}</div>
                </td>
                <td style="text-align: center;">
                    ${statusBadge}
                </td>
                <td style="text-align: center;">
                    <div class="actions">
                        <button class="action-btn action-edit" onclick="editDentist(${dentist.dentistId})" title="Edit Dentist">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn ${toggleClass} btn-sm" onclick="toggleDentistStatus(${dentist.dentistId})" title="${toggleLabel}">
                            <i class="fas ${toggleIcon}"></i> ${toggleLabel}
                        </button>
                        <button class="action-btn action-delete" onclick="deleteDentist(${dentist.dentistId})" title="Delete Dentist">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </td>
            `;

            tbody.appendChild(row);
        });
    }

    function editDentist(id) {
        window.location.href = CONTEXT_PATH + '/pages/dentists/edit.html?id=' + id;
    }

    function toggleDentistStatus(id) {
        var dentist = allDentists.find(function(d) { return d.dentistId === id; });
        if (!dentist) {
            showToast('Dentist not found', 'error');
            return;
        }

        var currentStatus = dentist.active === true;
        var actionText = currentStatus ? 'deactivate' : 'activate';
        var actionLabel = currentStatus ? 'Deactivate' : 'Activate';

        if (!confirm('Are you sure you want to ' + actionText + ' ' + dentist.firstName + ' ' + dentist.lastName + '?')) {
            return;
        }

        // Disable all toggle buttons during request
        document.querySelectorAll('.btn-toggle-active, .btn-toggle-inactive').forEach(function(btn) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        });

        fetch(CONTEXT_PATH + '/api/dentists?id=' + id + '&_method=PATCH', {
            method: 'POST'
        })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                if (data.success) {
                    showToast(data.message, 'success');
                    loadDentists();
                } else {
                    showToast('Error: ' + data.message, 'error');
                    document.querySelectorAll('.btn-toggle-active, .btn-toggle-inactive').forEach(function(btn) {
                        btn.disabled = false;
                    });
                }
            })
            .catch(function(error) {
                showToast('Error: ' + error.message, 'error');
                document.querySelectorAll('.btn-toggle-active, .btn-toggle-inactive').forEach(function(btn) {
                    btn.disabled = false;
                });
            });
    }

    function deleteDentist(id) {
        var dentist = allDentists.find(function(d) { return d.dentistId === id; });
        var name = dentist ? dentist.firstName + ' ' + dentist.lastName : 'this dentist';

        if (!confirm('Are you sure you want to delete ' + name + '? This action cannot be undone.')) {
            return;
        }

        fetch(CONTEXT_PATH + '/api/dentists?id=' + id + '&_method=DELETE', {
            method: 'POST'
        })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                if (data.success) {
                    showToast('Dentist deleted successfully!', 'success');
                    loadDentists();
                } else {
                    showToast('Error: ' + data.message, 'error');
                }
            })
            .catch(function(error) {
                showToast('Error: ' + error.message, 'error');
            });
    }

    function showToast(message, type) {
        if (type === undefined) type = 'info';
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast ' + type;

        var icons = {
            success: 'fa-check-circle',
            error: 'fa-exclamation-circle',
            warning: 'fa-exclamation-triangle',
            info: 'fa-info-circle'
        };

        var colors = {
            success: '#48bb78',
            error: '#f56565',
            warning: '#ecc94b',
            info: '#4299e1'
        };

        toast.innerHTML = '<i class="fas ' + icons[type] + '" style="font-size: 20px; color: ' + colors[type] + ';"></i>' +
            '<span style="flex: 1; color: var(--dark);">' + message + '</span>' +
            '<button onclick="this.parentElement.remove()" style="background: none; border: none; color: var(--gray); cursor: pointer; font-size: 16px;">' +
            '<i class="fas fa-times"></i></button>';

        container.appendChild(toast);

        setTimeout(function() {
            if (toast.parentElement) {
                toast.style.animation = 'fadeOut 0.3s ease';
                setTimeout(function() {
                    if (toast.parentElement) toast.remove();
                }, 300);
            }
        }, 4000);
    }
</script>
</body>
</html>
