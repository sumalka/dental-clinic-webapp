<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login · Dental Clinic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #eef2f6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1450px;
            height: 700px;
            background: white;
            border-radius: 2.5rem;
            box-shadow: 0 30px 60px -15px rgba(0, 40, 40, 0.3);
            overflow: hidden;
            margin: 1rem;
        }

        .hero-section {
            flex: 1.2;
            background: linear-gradient(135deg, rgba(11, 83, 69, 0.85) 0%, rgba(17, 122, 101, 0.80) 45%, rgba(69, 183, 170, 0.75) 100%),
            url('/dental_clinic_webapp_war_exploded/images/dental-bg.jpg');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 2.5rem 0 2.5rem;
            position: relative;
            isolation: isolate;
        }

        .hero-section::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 100px;
            background: white;
            clip-path: path('M0,70 C220,150 440,5 660,70 C880,135 1100,25 1320,70 L1320,160 L0,160 Z');
            z-index: 2;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 5;
            max-width: 600px;
            margin-bottom: 1.5rem;
        }

        .clinic-brand {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            padding: 0.2rem 1.8rem 0.2rem 0.2rem;
            border-radius: 120px;
            width: fit-content;
        }

        .logo-badge {
            width: 250px !important;
            height: 250px !important;
            background: transparent !important;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.4));
        }

        .clinic-brand span {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 3px 8px rgba(0,0,0,0.3);
            background: rgba(0,0,0,0.1);
            padding: 0.3rem 1.5rem;
            border-radius: 50px;
            letter-spacing: 0.5px;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .hero-subtitle {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 1.2rem;
            max-width: 460px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);
        }

        .feature-grid {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(5px);
            padding: 0.5rem 1.6rem;
            border-radius: 50px;
            width: fit-content;
            font-size: 0.95rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .feature-item i {
            font-size: 1.2rem;
            color: #f9e3a0;
        }

        .login-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 0.8rem;
            height: 100%;
            overflow-y: hidden;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            animation: fadeSlide 0.5s ease;
            margin-top: -130px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 0.02rem;
        }

        .login-logo {
            width: 300px !important;
            height: 300px !important;
            margin: 120px auto 2px auto !important;
            background: transparent !important;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            overflow: hidden;
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(30, 80, 80, 0.35));
        }

        .login-header h1 {
            color: #0c3b3b;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            line-height: 1.1;
        }

        .login-header .subtitle {
            color: #5f7e89;
            font-size: 0.75rem;
            margin-bottom: 0.02rem;
        }

        .form-group {
            margin-bottom: 0.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.08rem;
            color: #1a4b58;
            font-weight: 600;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i:not(.toggle-password) {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #2f8a8a;
            font-size: 0.85rem;
            pointer-events: none;
            z-index: 1;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.45rem 2.5rem 0.45rem 2.5rem;
            border: 1.5px solid #d5e3e8;
            border-radius: 10px;
            font-size: 0.85rem;
            background: white;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #126e6e;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #2f8a8a;
            font-size: 0.95rem;
            cursor: pointer;
            background: transparent;
            padding: 5px;
            border-radius: 50%;
            transition: all 0.2s ease;
            z-index: 2;
            user-select: none;
        }

        .toggle-password:hover {
            color: #0b5345;
            background: rgba(18, 110, 110, 0.1);
        }

        .btn-login {
            width: 100%;
            background: #126e6e;
            color: white;
            font-weight: 600;
            padding: 0.45rem;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            margin: 0.12rem 0 0.12rem;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #0f5a5a;
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        .divider {
            display: flex;
            align-items: center;
            color: #8aa9b5;
            font-size: 0.65rem;
            margin: 0.12rem 0 0.12rem;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: #d0e0e8;
        }

        .divider span {
            margin: 0 0.35rem;
        }

        .staff-block {
            background: #f1f9fc;
            border-radius: 10px;
            padding: 0.35rem 0.45rem 0.25rem;
            margin: 0.08rem 0 0.08rem;
            border: 1px solid #cae1e8;
        }

        .staff-title {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            color: #094c5c;
            font-size: 0.65rem;
            font-weight: 600;
            margin-bottom: 0.08rem;
        }

        .staff-title i {
            color: #148080;
            font-size: 0.75rem;
            background: white;
            padding: 0.12rem;
            border-radius: 60%;
        }

        .google-btn-wrapper {
            display: flex;
            justify-content: center;
            min-height: 25px;
            margin-bottom: 0.03rem;
            transform: scale(0.65);
            transform-origin: center;
        }

        .staff-note {
            font-size: 0.55rem;
            color: #2b5f6b;
            display: flex;
            align-items: flex-start;
            gap: 0.2rem;
            background: rgba(255,255,255,0.7);
            padding: 0.15rem 0.3rem;
            border-radius: 5px;
            line-height: 1.1;
        }

        .staff-note i {
            color: #1b7a7a;
            font-size: 0.6rem;
        }

        .new-staff-area {
            margin-top: 0.25rem;
            text-align: center;
            font-size: 0.6rem;
            color: #587b86;
            background: #ecf6fa;
            border-radius: 14px;
            padding: 0.2rem 0.15rem;
            line-height: 1.2;
        }

        .new-staff-area i {
            color: #126e6e;
            margin-right: 0.2rem;
            font-size: 0.6rem;
        }

        .new-staff-text {
            font-weight: 500;
        }

        .contact-text {
            display: block;
            margin-top: 0.02rem;
            font-size: 0.5rem;
            color: #195e6b;
        }

        .message-area {
            margin: 0.03rem 0;
            min-height: 28px;
        }

        .message {
            padding: 0.25rem 0.5rem;
            border-radius: 5px;
            font-size: 0.65rem;
            display: none;
            align-items: center;
            gap: 0.25rem;
            border-left: 4px solid;
            margin-bottom: 0.15rem;
            animation: slideIn 0.2s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message i {
            font-size: 0.75rem;
        }

        .message.error {
            background: #fee9e7;
            color: #a14341;
            border-left-color: #c24141;
        }

        .message.success {
            background: #def3ef;
            color: #136155;
            border-left-color: #178f7c;
        }

        .message.info {
            background: #e0f0f8;
            color: #0e5d77;
            border-left-color: #2580a3;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1100px) {
            .logo-badge { width: 180px !important; height: 180px !important; }
            .login-logo { width: 220px !important; height: 220px !important; margin-top: 90px !important; }
            .clinic-brand span { font-size: 1.5rem; }
            .hero-title { font-size: 2.2rem; }
            .login-card { margin-top: -100px; }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                max-height: 100vh;
                border-radius: 1.5rem;
            }
            .hero-section {
                padding: 1.5rem;
                min-height: 220px;
            }
            .hero-section::after {
                height: 40px;
            }
            .hero-title {
                font-size: 1.8rem;
            }
            .hero-subtitle {
                font-size: 0.85rem;
            }
            .clinic-brand {
                padding: 0.2rem 1rem 0.2rem 0.2rem;
                gap: 1rem;
            }
            .logo-badge {
                width: 120px !important;
                height: 120px !important;
            }
            .clinic-brand span {
                font-size: 1.1rem;
                padding: 0.2rem 1rem;
            }
            .login-section {
                padding: 0.6rem;
            }
            .login-logo {
                width: 180px !important;
                height: 180px !important;
                margin: 60px auto 2px auto !important;
            }
            .login-card {
                max-width: 100%;
                margin-top: 0;
            }
            .login-header h1 {
                font-size: 1.3rem;
            }
            .feature-grid {
                display: none;
            }
            .hero-subtitle {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 1.4rem;
            }
            .login-logo {
                width: 150px !important;
                height: 150px !important;
                margin: 50px auto 2px auto !important;
            }
            .logo-badge {
                width: 100px !important;
                height: 100px !important;
            }
            .login-header h1 {
                font-size: 1.1rem;
            }
            .container {
                margin: 0.5rem;
                border-radius: 1rem;
            }
            .clinic-brand span {
                font-size: 0.9rem;
            }
            .login-card {
                padding: 0 0.5rem;
                margin-top: 0;
            }
            .input-wrapper input {
                font-size: 0.8rem;
                padding: 0.4rem 1.8rem 0.4rem 1.8rem;
            }
        }

        #loginFrame {
            display: none;
        }

        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }

        input[type="password"]::-webkit-credentials-auto-fill-button,
        input[type="password"]::-webkit-textfield-decoration-container {
            display: none !important;
        }

    </style>
</head>
<body>
<div class="container">
    <div class="hero-section">
        <div class="hero-content">
            <div class="clinic-brand">
                <div class="logo-badge">
                    <img src="/dental_clinic_webapp_war_exploded/images/dental-logo.png" alt="Dental Clinic Logo" onerror="this.parentElement.innerHTML='<i class=\'fas fa-tooth\' style=\'font-size:4rem;color:#fff;\'></i>';">
                </div>
                <span>Dental Clinic</span>
            </div>
            <h1 class="hero-title">Welcome to Dental<br>Management System</h1>
            <p class="hero-subtitle">Staff platform — appointments, patients, billing.</p>
            <div class="feature-grid">
                <div class="feature-item"><i class="fas fa-lock"></i> Secure access</div>
                <div class="feature-item"><i class="fas fa-sync"></i> Real-time sync</div>
            </div>
        </div>
    </div>

    <div class="login-section">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <img src="/dental_clinic_webapp_war_exploded/images/dental-logo.png" alt="Dental Clinic Logo" onerror="this.parentElement.innerHTML='<i class=\'fas fa-tooth\' style=\'font-size:5rem;color:#126e6e;\'></i>';">
                </div>
                <h1>Staff sign in</h1>
                <p class="subtitle">internal credentials</p>
            </div>

            <div class="message-area">
                <div class="message error" id="errorMessage">
                    <i class="fas fa-exclamation-circle"></i>
                    <span></span>
                </div>
                <div class="message success" id="successMessage">
                    <i class="fas fa-check-circle"></i>
                    <span></span>
                </div>
                <div class="message info" id="infoMessage">
                    <i class="fas fa-info-circle"></i>
                    <span></span>
                </div>
            </div>

            <form id="loginForm" method="POST" action="/dental_clinic_webapp_war_exploded/login" target="loginFrame" novalidate>
                <div class="form-group">
                    <label for="username">USERNAME</label>
                    <div class="input-wrapper">
                        <i class="far fa-user-circle"></i>
                        <input type="text" name="username" id="username" placeholder="Enter your username" required autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key"></i>
                        <input type="password" name="password" id="password" placeholder="Enter your password" required autocomplete="off">
                        <i class="fas fa-eye-slash toggle-password" id="togglePassword" role="button" tabindex="0" aria-label="Toggle password visibility"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Access
                </button>
            </form>

            <iframe name="loginFrame" id="loginFrame"></iframe>

            <div class="divider">
                <span class="divider-line"></span>
                <span>staff recovery</span>
                <span class="divider-line"></span>
            </div>

            <div class="staff-block">
                <div class="staff-title">
                    <i class="fas fa-id-card"></i>
                    <span>Recover with Google</span>
                </div>

                <div id="g_id_onload"
                     data-client_id="960634809056-2cml9jbbkuulja3lk1gpt5hvugluc6hi.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleGoogleStaffRecovery"
                     data-auto_prompt="false">
                </div>

                <div class="google-btn-wrapper">
                    <div class="g_id_signin"
                         data-type="standard"
                         data-shape="rectangular"
                         data-theme="outline"
                         data-text="signin_with"
                         data-size="large"
                         data-logo_alignment="left"
                         data-width="200">
                    </div>
                </div>

                <div class="staff-note">
                    <i class="fas fa-envelope"></i>
                    <span><strong>Google email must match staff email</strong></span>
                </div>
            </div>

            <div class="new-staff-area">
                <span class="new-staff-text"><i class="fas fa-user-plus"></i> new staff?</span>
                <span class="contact-text">
                    <i class="fas fa-envelope"></i> contact system administrator
                </span>
            </div>
        </div>
    </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
    (function() {
        // Get elements
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loginFrame = document.getElementById('loginFrame');
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');
        const infoMsg = document.getElementById('infoMessage');

        // Store current input values
        let currentTypedUsername = '';
        let currentTypedPassword = '';

        // Track user input
        usernameInput.addEventListener('input', function(e) {
            currentTypedUsername = e.target.value;
        });

        passwordInput.addEventListener('input', function(e) {
            currentTypedPassword = e.target.value;
        });

        // Message display function
        window.showMessage = function(type, text) {
            // Hide all
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            infoMsg.style.display = 'none';

            // Clear all
            errorMsg.querySelector('span').innerHTML = '';
            successMsg.querySelector('span').innerHTML = '';
            infoMsg.querySelector('span').innerHTML = '';

            // Show target
            let target = type === 'error' ? errorMsg : (type === 'success' ? successMsg : infoMsg);
            target.querySelector('span').innerHTML = text;
            target.style.display = 'flex';

            // Auto hide after 4 seconds
            setTimeout(function() {
                target.style.display = 'none';
            }, 4000);
        };

        // Google Recovery
        window.handleGoogleStaffRecovery = async function(response) {
            showMessage('info', 'Verifying your Google account...');
            try {
                const res = await fetch('/dental_clinic_webapp_war_exploded/api/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        credential: response.credential
                    })
                });
                const data = await res.json();
                if (data.success && data.isStaff) {
                    showMessage('success', 'Recovery email sent! Please check your inbox.');
                    setTimeout(function() {
                        window.location.href = '/dental_clinic_webapp_war_exploded/login?recovery=success';
                    }, 1500);
                } else {
                    showMessage('info', 'No staff account found with this Google email. Please contact administrator.');
                }
            } catch (e) {
                console.error('Google recovery error:', e);
                showMessage('error', 'Network error. Please check your connection and try again.');
            }
        };

        // Check URL params
        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);

            // Show appropriate message based on URL params
            if (params.get('error') === 'true') {
                showMessage('error', 'Invalid username or password. Please try again.');
            }
            if (params.get('error') === 'inactive') {
                showMessage('error', 'Account is inactive. Contact administrator.');
            }
            if (params.get('recovery') === 'success') {
                showMessage('success', 'Password reset complete! You can now login.');
            }
            if (params.get('logout') === 'success') {
                showMessage('success', 'Logged out successfully.');
            }

            // Clean URL without reloading page
            if (params.toString()) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        // Toggle password
        window.togglePassword = function() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            const icon = document.getElementById('togglePassword');
            if (type === 'password') {
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        };

        // Handle form submit - using AJAX instead of iframe for better control
        loginForm.onsubmit = function(e) {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username) {
                showMessage('error', 'Please enter your username.');
                usernameInput.focus();
                return false;
            }

            if (!password) {
                showMessage('error', 'Please enter your password.');
                passwordInput.focus();
                return false;
            }

            // Disable button
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            // Send AJAX request to AuthController
            fetch('/dental_clinic_webapp_war_exploded/api/auth', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            })
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    if (data.success) {
                        showMessage('success', 'Login successful! Redirecting...');
                        // Redirect to dashboard
                        window.location.href = '/dental_clinic_webapp_war_exploded/dashboard';
                    } else {
                        showMessage('error', data.message || 'Invalid username or password');
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Access';
                        passwordInput.focus();
                        passwordInput.select();
                    }
                })
                .catch(function(error) {
                    console.error('Login error:', error);
                    showMessage('error', 'Network error. Please try again.');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Access';
                });

            return false;
        };

        // Password toggle click
        document.getElementById('togglePassword').onclick = togglePassword;

        // Enter key on password field
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        // Check URL params on page load
